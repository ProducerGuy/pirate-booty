<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FB Cam Controls">
<meta name="theme-color" content="#0b0f14">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Freebooter Camera Controls</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:#0b0f14; color:#e8eef5;
         font:16px/1.4 -apple-system, system-ui, sans-serif; max-width:640px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 10px; }
  #env { font:12px/1.3 ui-monospace, Menlo, monospace; color:#8aa0b6; margin:0 0 12px; }
  button { display:block; width:100%; margin:8px 0; padding:15px; font-size:17px; font-weight:600;
           border:0; border-radius:12px; background:#2d6cdf; color:#fff; -webkit-tap-highlight-color:transparent; }
  button.secondary { background:#24344a; }
  button:disabled { opacity:.4; }
  video { width:100%; border-radius:12px; background:#000; margin:10px 0; display:block; }
  .ctl { margin:10px 0 2px; }
  .ctl label { font-size:15px; color:#e8eef5; display:flex; justify-content:space-between; margin-bottom:6px; }
  input[type=range] { width:100%; height:34px; }
  #log { font:12px/1.5 ui-monospace, Menlo, monospace; color:#9fb3c8; margin-top:16px;
         white-space:pre-wrap; word-break:break-word; }
  .ok{color:#6ee7a8;} .warn{color:#ffd479;} .bad{color:#ff8a8a;}
  [hidden]{ display:none !important; }
</style>
</head>
<body>
  <h1>Freebooter — Camera Controls</h1>
  <div id="env">…</div>

  <button id="start">Start Camera</button>
  <video id="video" playsinline autoplay muted></video>

  <button id="flip" class="secondary" hidden>Flip front / back</button>
  <button id="torch" class="secondary" hidden>Torch: OFF</button>
  <div class="ctl" id="zoomWrap" hidden>
    <label>Zoom <span id="zval">1.0×</span></label>
    <input type="range" id="zoom" min="1" max="1" step="0.1" value="1">
  </div>

  <div id="log"></div>

<script>
(function () {
  var $=function(id){return document.getElementById(id);};
  var video=$('video'), start=$('start'), flip=$('flip'), torch=$('torch');
  var zoomWrap=$('zoomWrap'), zoom=$('zoom'), zval=$('zval'), logEl=$('log'), envEl=$('env');
  var stream=null, track=null, facing='environment', torchOn=false;

  function log(m,c){ var s=document.createElement('div'); if(c)s.className=c;
    s.textContent='['+new Date().toLocaleTimeString()+'] '+m; logEl.appendChild(s); }

  var stand=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  envEl.textContent='Installed app: '+(stand?'YES':'no (browser tab)');

  function stop(){ if(stream){stream.getTracks().forEach(function(t){t.stop();}); stream=null; track=null;} }

  function go(){
    stop();
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:facing} }, audio:false })
      .then(function(s){
        stream=s; video.srcObject=s; var p=video.play(); if(p&&p.catch)p.catch(function(){});
        track=s.getVideoTracks()[0];
        start.textContent='Restart Camera'; flip.hidden=false;
        log((facing==='environment'?'Back':'Front')+' camera on.', 'ok');
        setupZoomTorch();
      })
      .catch(function(e){ log('Camera failed: '+e.name,'bad'); });
  }

  function setupZoomTorch(){
    var cap = (track && track.getCapabilities) ? track.getCapabilities() : {};
    var set = (track && track.getSettings) ? track.getSettings() : {};
    if(cap.zoom && cap.zoom.max>cap.zoom.min){
      zoomWrap.hidden=false;
      zoom.min=cap.zoom.min; zoom.max=cap.zoom.max; zoom.step=cap.zoom.step||0.1; zoom.value=set.zoom||cap.zoom.min;
      zval.textContent=(+zoom.value).toFixed(1)+'×';
    } else { zoomWrap.hidden=true; log('zoom: not available on this camera','warn'); }
    torch.hidden = !cap.torch;
    if(!cap.torch) log('torch: not available on this camera','warn');
  }

  start.addEventListener('click', go);
  flip.addEventListener('click', function(){ facing=(facing==='environment')?'user':'environment'; go(); });
  torch.addEventListener('click', function(){
    if(!track||!track.applyConstraints) return;
    torchOn=!torchOn;
    track.applyConstraints({advanced:[{torch:torchOn}]})
      .then(function(){ torch.textContent='Torch: '+(torchOn?'ON':'OFF'); })
      .catch(function(e){ log('torch failed: '+e.name,'bad'); });
  });
  zoom.addEventListener('input', function(){
    zval.textContent=(+zoom.value).toFixed(1)+'×';
    if(track&&track.applyConstraints) track.applyConstraints({advanced:[{zoom:+zoom.value}]}).catch(function(){});
  });
})();
</script>
</body>
</html>
