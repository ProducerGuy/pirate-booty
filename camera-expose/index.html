<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FB Cam Names">
<meta name="theme-color" content="#0b0f14">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Freebooter Camera Names</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:#0b0f14; color:#e8eef5;
         font:16px/1.45 -apple-system, system-ui, sans-serif; max-width:640px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#8aa0b6; font-size:13px; margin:0 0 14px; }
  h2 { font-size:14px; color:#8aa0b6; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  button { display:block; width:100%; margin:8px 0; padding:15px; font-size:17px; font-weight:600;
           border:0; border-radius:12px; background:#2d6cdf; color:#fff; -webkit-tap-highlight-color:transparent; }
  video { width:100%; border-radius:12px; background:#000; margin:8px 0; display:block; max-height:34vh; object-fit:cover; }
  .box { background:#121822; border:1px solid #223247; border-radius:10px; padding:10px 12px; margin:4px 0; }
  .line { font:13px/1.7 ui-monospace, Menlo, monospace; display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid #1b2635; padding:1px 0; }
  .line:last-child { border-bottom:0; }
  .k { color:#9fb3c8; } .v { color:#e8eef5; text-align:right; word-break:break-word; }
  .hit { color:#6ee7a8; font-weight:700; }
</style>
</head>
<body>
  <h1>Camera — every name your phone exposes</h1>
  <p class="sub">No guessing. Dumps the full capability list and every lens, whatever they turn out to be.</p>

  <button id="read">Read camera</button>
  <video id="video" playsinline autoplay muted></video>

  <h2>Capabilities (every key returned)</h2>
  <div class="box" id="caps"><div class="line"><span class="k">tap “Read camera”</span></div></div>

  <h2>Lenses (every camera)</h2>
  <div class="box" id="lenses"><div class="line"><span class="k">—</span></div></div>

  <h2>Settings now</h2>
  <div class="box" id="settings"><div class="line"><span class="k">—</span></div></div>

<script>
(function () {
  var $=function(id){return document.getElementById(id);};
  var video=$('video'), capsEl=$('caps'), lensEl=$('lenses'), setEl=$('settings');
  var stream=null, track=null;
  // names worth flagging if they show up
  var FLAG = {backgroundBlur:1, portraitEffect:1, faceFraming:1, torch:1, zoom:1, focusMode:1, whiteBalanceMode:1, exposureMode:1};

  function fmt(v){
    if(v===null||v===undefined) return String(v);
    if(Array.isArray(v)) return v.join(', ');
    if(typeof v==='object'){ if('min' in v||'max' in v) return (v.min!==undefined?v.min:'?')+' – '+(v.max!==undefined?v.max:'?')+(v.step?' step '+v.step:''); return JSON.stringify(v); }
    return String(v);
  }
  function render(el, obj){
    var keys = obj?Object.keys(obj):[];
    if(!keys.length){ el.innerHTML='<div class="line"><span class="k">(nothing returned)</span></div>'; return; }
    el.innerHTML = keys.map(function(k){
      var cls = FLAG[k] ? 'k hit' : 'k';
      return '<div class="line"><span class="'+cls+'">'+k+'</span><span class="v">'+fmt(obj[k])+'</span></div>';
    }).join('');
  }

  $('read').addEventListener('click', function(){
    if(stream){ stream.getTracks().forEach(function(t){t.stop();}); }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'environment'} }, audio:false }).then(function(s){
      stream=s; video.srcObject=s; var p=video.play(); if(p&&p.catch)p.catch(function(){});
      track=s.getVideoTracks()[0];
      render(capsEl, track.getCapabilities ? track.getCapabilities() : null);
      render(setEl, track.getSettings ? track.getSettings() : null);
      // lenses
      navigator.mediaDevices.enumerateDevices().then(function(list){
        var cams = list.filter(function(d){return d.kind==='videoinput';});
        lensEl.innerHTML = cams.map(function(d,i){
          return '<div class="line"><span class="k">'+(d.label||('camera '+(i+1)))+'</span><span class="v">'+d.deviceId.slice(0,10)+'…</span></div>';
        }).join('') || '<div class="line"><span class="k">(no labels — grant permission first)</span></div>';
      }).catch(function(e){ lensEl.innerHTML='<div class="line"><span class="k">enumerate failed: '+e.name+'</span></div>'; });
    }).catch(function(e){ capsEl.innerHTML='<div class="line"><span class="k">camera failed: '+e.name+'</span></div>'; });
  });
})();
</script>
</body>
</html>
