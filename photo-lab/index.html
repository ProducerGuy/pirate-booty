<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FB Photo">
<meta name="theme-color" content="#0b0f14">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Freebooter Photo Lab</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #0b0f14; color: #e8eef5;
         font: 16px/1.4 -apple-system, system-ui, sans-serif; max-width: 640px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8aa0b6; font-size: 13px; margin: 0 0 14px; }
  .env { font: 12px/1.4 ui-monospace, Menlo, monospace; color: #9fb3c8;
         background: #121822; border: 1px solid #223247; border-radius: 8px;
         padding: 8px 10px; margin-bottom: 14px; white-space: pre-wrap; word-break: break-word; }
  button { display: block; width: 100%; margin: 8px 0; padding: 16px; font-size: 18px; font-weight: 600;
           border: 0; border-radius: 12px; background: #2d6cdf; color: #fff; -webkit-tap-highlight-color: transparent; }
  button.secondary { background: #24344a; }
  button.save { background: #1f8f5f; }
  button:disabled { opacity: .4; }
  input[type=file] { display: none; }
  #stage { display: none; margin-top: 8px; }
  #size { font: 13px/1.4 ui-monospace, Menlo, monospace; color: #6ee7a8; text-align: center; margin: 8px 0; }
  #preview { width: 100%; border-radius: 12px; background: #000; display: block; }
  .ctl { margin: 14px 0 4px; }
  .ctl label { font-size: 14px; color: #cfe0f0; display: flex; justify-content: space-between; margin-bottom: 6px; }
  input[type=range] { width: 100%; }
  h2 { font-size: 14px; color: #8aa0b6; margin: 20px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  #log { font: 12px/1.5 ui-monospace, Menlo, monospace; color: #cfe0f0; background: #121822;
         border: 1px solid #223247; border-radius: 8px; padding: 10px; white-space: pre-wrap; word-break: break-word; min-height: 48px; }
  .ok { color: #6ee7a8; } .bad { color: #ff8a8a; } .warn { color: #ffd479; }
</style>
</head>
<body>
  <h1>Freebooter — Photo Lab</h1>
  <p class="sub">Native camera to app to library to edit to save — proof of concept</p>

  <div class="env" id="env">reading environment…</div>

  <button id="camBtn">Take Photo (iPhone camera)</button>
  <button id="libBtn" class="secondary">Choose from Library</button>

  <input type="file" id="camInput" accept="image/*" capture="environment">
  <input type="file" id="libInput" accept="image/*">

  <div id="stage">
    <div id="size"></div>
    <img id="preview" alt="your photo">
    <div class="ctl">
      <label>Brightness <span id="bval">100%</span></label>
      <input type="range" id="bright" min="0" max="2" step="0.01" value="1">
    </div>
    <button id="saveBtn" class="save">Save Photo (to Share sheet)</button>
  </div>

  <h2>Evidence log</h2>
  <div id="log"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var camBtn=$('camBtn'), libBtn=$('libBtn'), camInput=$('camInput'), libInput=$('libInput');
  var stage=$('stage'), sizeEl=$('size'), preview=$('preview'), bright=$('bright'), bval=$('bval'),
      saveBtn=$('saveBtn'), logEl=$('log'), envEl=$('env');
  var objURL = null, natW = 0, natH = 0;

  function log(msg, cls) {
    var s = document.createElement('div');
    if (cls) s.className = cls;
    s.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    logEl.appendChild(s); logEl.scrollTop = logEl.scrollHeight;
  }

  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                   || window.navigator.standalone === true;
  var canShareFiles = !!(navigator.canShare && (function(){ try { return navigator.canShare({ files: [new File([new Blob()], 'x.jpg', {type:'image/jpeg'})] }); } catch(e){ return false; } })());
  envEl.textContent =
    'Installed app (standalone): ' + (standalone ? 'YES' : 'NO — opened in browser') + '\n' +
    'Secure context (HTTPS): ' + (window.isSecureContext ? 'yes' : 'NO') + '\n' +
    'Share-to-Photos available: ' + (canShareFiles ? 'yes' : 'no (will use download fallback)') + '\n' +
    'Device: ' + navigator.userAgent;
  log('Init — standalone=' + standalone + ', shareFiles=' + canShareFiles, 'ok');

  function loadFile(file, where) {
    if (!file) return;
    log(where + ': got ' + file.type + ', ' + Math.round(file.size/1024) + ' KB');
    if (objURL) URL.revokeObjectURL(objURL);
    objURL = URL.createObjectURL(file);
    var probe = new Image();
    probe.onload = function () {
      natW = probe.naturalWidth; natH = probe.naturalHeight;
      preview.src = objURL;
      sizeEl.textContent = 'Photo: ' + natW + ' × ' + natH + '  (native resolution)';
      stage.style.display = 'block';
      applyPreview();
      saveBtn.disabled = false;
      log(where + ' loaded — native ' + natW + '×' + natH + '. Full resolution, not a low-res stream.', 'ok');
    };
    probe.onerror = function () { log(where + ' FAILED to decode image.', 'bad'); };
    probe.src = objURL;
  }

  function applyPreview() {
    var v = parseFloat(bright.value);
    preview.style.filter = 'brightness(' + v + ')';
    bval.textContent = Math.round(v * 100) + '%';
  }

  camBtn.addEventListener('click', function () { camInput.click(); });
  libBtn.addEventListener('click', function () { libInput.click(); });
  camInput.addEventListener('change', function (e) { loadFile(e.target.files[0], 'Camera'); });
  libInput.addEventListener('change', function (e) { loadFile(e.target.files[0], 'Library'); });
  bright.addEventListener('input', applyPreview);

  saveBtn.addEventListener('click', function () {
    if (!objURL) return;
    var v = parseFloat(bright.value);
    log('Baking brightness ' + Math.round(v*100) + '% into a full-res ' + natW + '×' + natH + ' JPEG …');
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas');
      c.width = natW; c.height = natH;
      var ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, natW, natH);
      try {
        var d = ctx.getImageData(0, 0, natW, natH), p = d.data;
        for (var i = 0; i < p.length; i += 4) {
          p[i]   = Math.min(255, p[i]   * v);
          p[i+1] = Math.min(255, p[i+1] * v);
          p[i+2] = Math.min(255, p[i+2] * v);
        }
        ctx.putImageData(d, 0, 0);
      } catch (err) { log('Edit bake FAILED: ' + err.name + ' — ' + err.message, 'bad'); return; }
      c.toBlob(function (blob) {
        if (!blob) { log('Encode FAILED.', 'bad'); return; }
        var file = new File([blob], 'freebooter-edit.jpg', { type: 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: 'Freebooter edit' })
            .then(function () { log('Shared to iOS Share sheet — tap Save Image to store in Photos. DONE.', 'ok'); })
            .catch(function (err) { log('Share cancelled/failed: ' + err.name, 'warn'); });
        } else {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url; a.download = 'freebooter-edit.jpg'; a.textContent = 'Download edited photo';
          a.style.cssText = 'display:block;text-align:center;color:#6ee7a8;margin:10px 0;';
          saveBtn.after(a);
          log('Share sheet not available — added a Download link (long-press to Save Image).', 'warn');
        }
      }, 'image/jpeg', 0.92);
    };
    img.src = objURL;
  });
})();
</script>
</body>
</html>
